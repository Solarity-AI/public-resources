name: Docs check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"
      - name: Links, file names, sizes, and READMEs
        run: python3 scripts/check_docs.py
