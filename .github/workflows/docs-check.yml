name: Docs check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # npm ci installs markdownlint-cli2 from package-lock.json: never run package install scripts
      npm_config_ignore_scripts: "true"
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install markdownlint-cli2 from package-lock.json
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install Pillow for the script tests
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Markdown lint, links, file names, sizes, READMEs, and script tests
        run: python scripts/check.py
