name: Docs check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # npx runs markdownlint from the registry: never run package install scripts
      npm_config_ignore_scripts: "true"
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install Pillow for the script tests
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Markdown lint, links, file names, sizes, READMEs, and script tests
        run: python scripts/check.py
